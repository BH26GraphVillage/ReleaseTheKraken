name: Release the Kraken

# Shipyard automation. Cuts a release from a "legacy-v*" tag, forges the build
# manifest for the fleet, and nails it to the release page as an asset.
#
# Quartermaster's note: the manifest is the only record of what actually sailed
# with a given hull, so do not prune old releases without asking the Captain.

on:
  push:
    tags:
      - "legacy-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to cut the release from (e.g. legacy-v1)'
        required: true
        default: "legacy-v1"

permissions:
  contents: write

env:
  MANIFEST_NAME: build-manifest.json
  SHIPYARD: "Drydock 7, Port Royal"

jobs:
  release-the-kraken:
    name: Cut release and nail up the manifest
    runs-on: ubuntu-latest
    steps:
      - name: Come aboard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the hull
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Forge the build manifest
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess

          tag = os.environ["RELEASE_TAG"]
          wheel = sorted(pathlib.Path("dist").glob("*.whl"))[0]
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()

          manifest = {
              "vessel": "S.S. Kraken",
              "artifact": "krakenctl",
              "release_tag": tag,
              "shipyard": os.environ.get("SHIPYARD", "unknown"),
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "wheel": wheel.name,
              "sha256": digest,
          }

          pathlib.Path(os.environ["MANIFEST_NAME"]).write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY

      - name: Nail the manifest to the release page
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "krakenctl ${{ github.event.inputs.tag || github.ref_name }}"
          files: |
            dist/*.whl
            ${{ env.MANIFEST_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
