name: Deckhand Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  swab-the-deck:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Come aboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stow the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff

      - name: Inspect the rigging
        run: ruff check src tests

      - name: Run the drills
        run: pytest -q
