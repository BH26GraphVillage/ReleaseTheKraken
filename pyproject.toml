[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krakenctl"
version = "1.1.0"
description = "Deck utilities for the S.S. Kraken navigation console"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "S.S. Kraken Navigation Crew" }]

[project.scripts]
krakenctl = "krakenctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
